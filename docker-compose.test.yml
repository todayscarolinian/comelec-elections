# Disposable Postgres for `npm run test:integration`. Data lives in tmpfs,
# so every recreate starts from an empty database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comelec_test
      POSTGRES_PASSWORD: comelec_test
      POSTGRES_DB: comelec_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'comelec_test', '-d', 'comelec_test']
      interval: 2s
      timeout: 5s
      retries: 15
